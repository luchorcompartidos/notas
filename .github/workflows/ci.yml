# Publica la web en GitHub Pages y compila el APK en cada push a main.
# Versión (SemVer): poné [patch], [minor] o [major] en el mensaje del commit para crear una Release.
# Sin marca: se publica la web y se compila un APK de prueba (artefacto), pero NO se crea Release.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de Release"
        type: choice
        options: [ninguna, patch, minor, major]
        default: ninguna

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Calcular versión desde los tags
        env:
          MSG: ${{ github.event.head_commit.message }}
          BUMP_IN: ${{ github.event.inputs.bump }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ -z "$last" ] && last="v0.0.0"
          IFS=. read -r MA MI PA <<< "${last#v}"
          bump=""
          case "$MSG" in
            *"[skip release]"*) bump="" ;;
            *"[major]"*) bump=major ;;
            *"[minor]"*) bump=minor ;;
            *"[patch]"*) bump=patch ;;
          esac
          if [ -n "$BUMP_IN" ] && [ "$BUMP_IN" != "ninguna" ]; then bump="$BUMP_IN"; fi
          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          if [ -n "$bump" ]; then
            echo "version=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release nueva: v$MA.$MI.$PA ($bump)"
          else
            echo "version=$MA.$MI.$PA-prueba" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Sin Release::El commit no tiene [patch], [minor] ni [major]. Se publica la web y se compila un APK de prueba, pero no se crea Release. Para crearla, usá 'Run workflow' y elegí el tipo."
            {
              echo "## ⚠️ Push sin Release"
              echo
              echo "No se creó tag ni Release. La web se publica igual y el APK de prueba queda en *Artifacts*."
              echo
              echo "**¿Preferís crear una versión de este cambio?** Entrá a [CI]($LINK), tocá **Run workflow** y elegí el tipo (patch, minor o major)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  web:
    needs: version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.VERSION }}
      - name: Generar proyecto Android
        run: npx cap add android
      - name: Ajustes Android (versión y teclado)
        run: |
          IFS=. read -r MA MI PA <<< "${VERSION%%-*}"
          CODE=$((MA*10000 + MI*100 + PA)); [ "$CODE" -lt 1 ] && CODE=1
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q windowSoftInputMode "$MANIFEST" || sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:windowSoftInputMode="adjustResize"/' "$MANIFEST"
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Renombrar APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/notas-v${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: notas-v${{ env.VERSION }}
          path: out/*.apk
      - name: Crear Release
        if: needs.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*.apk
